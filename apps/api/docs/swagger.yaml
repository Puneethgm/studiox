info:
  contact:
    name: Project-X support
  description: |-
    REST API for Project-X — the AI-run marketing + studio operations platform.
    Auth is a JWT stored in an HTTP-only cookie (set by POST /api/v1/auth/login).
    When calling protected endpoints from a tool like Swagger UI or curl, log in first and reuse the returned cookie.
  license:
    name: Proprietary
  title: Project-X API
  version: "1.0"
paths:
  /api/v1/admin/analytics:
    get:
      description: Returns an analytics summary for the resolved studio over a time
        window. `duration` accepts '15d'/'30d'/'90d'/'365d' or any 'Nd' value; an
        explicit `startDate`/`endDate` range can also be supplied; omitting duration
        returns all-time. Mounted at both the super-admin prefix and the studio-scoped
        prefix; see resolveStudioID note on createCampaign above regarding studioId
        resolution at the super-admin prefix.
      parameters:
      - description: 'Time window, e.g. ''30d'' (default: all-time)'
        in: query
        name: duration
        type: string
      - description: Explicit range start date
        in: query
        name: startDate
        type: string
      - description: Explicit range end date
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.AnalyticsSummary'
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Lead analytics summary
      tags:
      - Leads
  /api/v1/admin/campaigns:
    get:
      description: Lists campaigns for the resolved studio, paginated via `limit`/`offset`
        query params (default limit 50), each with its public share URL. Mounted at
        both the super-admin prefix and the studio-scoped prefix; see resolveStudioID
        note on createCampaign above regarding studioId resolution at the super-admin
        prefix.
      parameters:
      - description: Max campaigns to return (default 50)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{campaigns: campaignRes[], total: int}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List campaigns
      tags:
      - Campaigns
    post:
      consumes:
      - application/json
      description: Creates a new campaign (slug, name, description, fitness plans)
        for the resolved studio and returns it with its public share URL. Mounted
        at both the super-admin prefix and the studio-scoped prefix. resolveStudioID
        reads `studioId` only from the URL path; the super-admin prefix below has
        no `{studioId}` path segment, so calling it there currently returns 400 studioId
        parameter required — the studio-scoped path is the only way this works today.
      parameters:
      - description: Campaign fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.createCampaignReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_leads.campaignRes'
        "400":
          description: validation failed or missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "409":
          description: slug already in use
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a campaign
      tags:
      - Campaigns
  /api/v1/admin/campaigns/{id}:
    get:
      description: Fetches a single campaign by ID for the resolved studio, including
        its public share URL. Mounted at both the super-admin prefix and the studio-scoped
        prefix; see resolveStudioID note on createCampaign above regarding studioId
        resolution at the super-admin prefix.
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.campaignRes'
        "400":
          description: missing/invalid studioId or invalid campaign id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: campaign not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get a campaign
      tags:
      - Campaigns
    patch:
      consumes:
      - application/json
      description: 'Partially updates a campaign: `fitnessPlans` (replaces the list)
        and/or `active` (activate/deactivate). Either or both fields may be supplied;
        returns the campaign after applying the requested changes. Mounted at both
        the super-admin prefix and the studio-scoped prefix; see resolveStudioID note
        on createCampaign above regarding studioId resolution at the super-admin prefix.'
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.patchCampaignReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.campaignRes'
        "400":
          description: validation failed, missing/invalid studioId, or invalid campaign
            id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: campaign not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update a campaign
      tags:
      - Campaigns
  /api/v1/admin/google-credentials:
    get:
      description: Returns whether platform-level Google Sheets service-account credentials
        are configured, along with the associated client email and project ID (never
        the private key). Super-admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get platform Google service-account credential status
      tags:
      - Studios
    post:
      consumes:
      - multipart/form-data
      description: Uploads a Google service-account JSON key file (max 1MB) used platform-wide
        for Google Sheets integration. Validates the file is a service_account credential
        before saving it to disk. Super-admin only.
      parameters:
      - description: Google service-account JSON key file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing file, invalid JSON, or not a service account key
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Upload platform Google service-account credentials
      tags:
      - Studios
  /api/v1/admin/leads:
    get:
      description: Lists leads for the resolved studio with extensive optional filtering
        (campaign, status, attempt count, source, date range/duration, hot lead, contact
        made, trial purchased) plus free-text search and pagination. Mounted at both
        the super-admin prefix and the studio-scoped prefix; see resolveStudioID note
        on createCampaign above regarding studioId resolution at the super-admin prefix.
      parameters:
      - description: Filter by campaign ID
        in: query
        name: campaignId
        type: string
      - description: Filter by a single lead status
        in: query
        name: status
        type: string
      - description: Filter by comma-separated lead statuses
        in: query
        name: statuses
        type: string
      - description: Filter by maximum contact attempts
        in: query
        name: maxAttempts
        type: integer
      - description: Filter by lead source
        in: query
        name: source
        type: string
      - description: 'Filter: created on/after this date'
        in: query
        name: startDate
        type: string
      - description: 'Filter: created on/before this date'
        in: query
        name: endDate
        type: string
      - description: 'Filter: created within the last N days, e.g. ''30d'''
        in: query
        name: duration
        type: string
      - description: Filter by hot-lead flag
        in: query
        name: hotLead
        type: boolean
      - description: Filter by contact-made flag
        in: query
        name: contactMade
        type: boolean
      - description: Filter by trial-purchased flag
        in: query
        name: trialPurchased
        type: boolean
      - description: Free-text search
        in: query
        name: search
        type: string
      - description: Max leads to return
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{leads: Lead[], total: int}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List leads
      tags:
      - Leads
  /api/v1/admin/leads/{id}:
    get:
      description: Fetches a single lead by ID for the resolved studio. Mounted at
        both the super-admin prefix and the studio-scoped prefix; see resolveStudioID
        note on createCampaign above regarding studioId resolution at the super-admin
        prefix.
      parameters:
      - description: Lead ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.Lead'
        "400":
          description: missing/invalid studioId or invalid lead id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: lead not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get a lead
      tags:
      - Leads
    patch:
      consumes:
      - application/json
      description: Partially updates a lead (status, notes, contact/hot-lead/trial
        flags, fitness plan, name, assignment, trial attendance, member sold, monthly
        fee, currency, offer, further notes). Unset fields keep their current value;
        returns the lead after applying the requested changes. Mounted at both the
        super-admin prefix and the studio-scoped prefix; see resolveStudioID note
        on createCampaign above regarding studioId resolution at the super-admin prefix.
      parameters:
      - description: Lead ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.patchLeadReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.Lead'
        "400":
          description: validation failed, missing/invalid studioId, or invalid lead
            id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: lead not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Update a lead
      tags:
      - Leads
  /api/v1/admin/leads/{id}/dnd:
    patch:
      consumes:
      - application/json
      description: Toggles Do Not Disturb for a lead. Turning it on silences all automated
        messaging (autocontact follow-ups, AI/decision-tree replies) and cancels every
        already-queued send for this lead; the lead's pipeline status is left untouched.
        Mounted at both the super-admin prefix and the studio-scoped prefix; see resolveStudioID
        note on createCampaign above regarding studioId resolution at the super-admin
        prefix.
      parameters:
      - description: Lead ID
        in: path
        name: id
        required: true
        type: string
      - description: DND state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.setLeadDNDReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.Lead'
        "400":
          description: missing/invalid studioId or invalid lead id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: lead not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Set lead Do Not Disturb
      tags:
      - Leads
  /api/v1/admin/leads/external-sheet-settings:
    get:
      description: Returns the resolved studio's settings for importing leads from
        an external Google Sheet (spreadsheet ID, tab name, column mappings, and import
        behavior flags). If none have been saved yet, returns sensible defaults. Mounted
        at both the super-admin prefix and the studio-scoped prefix; see resolveStudioID
        note on createCampaign above regarding studioId resolution at the super-admin
        prefix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.ExternalLeadsSheetSettings'
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get external leads sheet import settings
      tags:
      - Leads
    post:
      consumes:
      - application/json
      description: Creates or updates the resolved studio's settings for importing
        leads from an external Google Sheet, including column mappings and import
        behavior flags (`autoContactEnabled` defaults to true when omitted). `spreadsheetId`
        is required. Mounted at both the super-admin prefix and the studio-scoped
        prefix; see resolveStudioID note on createCampaign above regarding studioId
        resolution at the super-admin prefix.
      parameters:
      - description: External sheet settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.saveExternalLeadsSheetSettingsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.ExternalLeadsSheetSettings'
        "400":
          description: validation failed or missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Save external leads sheet import settings
      tags:
      - Leads
  /api/v1/admin/leads/import:
    post:
      consumes:
      - multipart/form-data
      description: Bulk-imports leads for the resolved studio from an uploaded .csv,
        .xlsx, or .xls file (multipart form, 10MB max), assigning them to the given
        default campaign. Mounted at both the super-admin prefix and the studio-scoped
        prefix; see resolveStudioID note on createCampaign above regarding studioId
        resolution at the super-admin prefix.
      parameters:
      - description: CSV or Excel (.xlsx/.xls) file of leads
        in: formData
        name: file
        required: true
        type: file
      - description: Default campaign ID to assign imported leads to
        in: formData
        name: campaignId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{imported: int, message: string}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing/invalid studioId, missing/invalid campaignId, malformed
            multipart form, unsupported file format, or unparseable file
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: import failed
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Import leads from a file
      tags:
      - Leads
  /api/v1/admin/leads/sheets-settings:
    get:
      description: 'Returns the resolved studio''s Google Sheets outbox sync settings
        (spreadsheet ID, tab name, active flag). If none have been saved yet, returns
        a default {spreadsheetId: "", tabName: "Leads", active: false}. Mounted at
        both the super-admin prefix and the studio-scoped prefix; see resolveStudioID
        note on createCampaign above regarding studioId resolution at the super-admin
        prefix.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.StudioSheetsSettings'
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get Google Sheets sync settings
      tags:
      - Leads
    post:
      consumes:
      - application/json
      description: Creates or updates the resolved studio's Google Sheets outbox sync
        settings. `spreadsheetId` is required. Mounted at both the super-admin prefix
        and the studio-scoped prefix; see resolveStudioID note on createCampaign above
        regarding studioId resolution at the super-admin prefix.
      parameters:
      - description: Sheets settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_leads.saveSheetsSettingsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.StudioSheetsSettings'
        "400":
          description: validation failed or missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Save Google Sheets sync settings
      tags:
      - Leads
  /api/v1/admin/leads/sources:
    get:
      description: Returns the distinct `source` values seen across the resolved studio's
        leads, for populating filter dropdowns. Mounted at both the super-admin prefix
        and the studio-scoped prefix; see resolveStudioID note on createCampaign above
        regarding studioId resolution at the super-admin prefix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: List unique lead sources
      tags:
      - Leads
  /api/v1/admin/leads/stats:
    get:
      description: Returns aggregate lead counts (total + breakdown by status) for
        the resolved studio, for pipeline widgets. Mounted at both the super-admin
        prefix and the studio-scoped prefix; see resolveStudioID note on createCampaign
        above regarding studioId resolution at the super-admin prefix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_leads.LeadStats'
        "400":
          description: missing/invalid studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Lead stats
      tags:
