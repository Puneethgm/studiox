          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Upload studio logo
      tags:
      - Studios
  /api/v1/me/studios/{id}/payments:
    get:
      description: Returns the studio's connected Stripe account ID, publishable key,
