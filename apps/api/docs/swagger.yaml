  /api/v1/auth/google/callback:
    get:
      description: 'Redirect target Google sends the browser back to after the user
        grants (or denies) Ads access. Exchanges the authorization code for a refresh
        token, then creates or updates the studio''s Google Ads channel_account with
        it. Not called directly — Google invokes this via browser redirect after LoginHandler.
        Responds with a small HTML page that closes the OAuth popup and notifies the
        opener window. No cookie auth: the studio identity travels inside the signed
        `state` param round-tripped through Google.'
      parameters:
      - description: Authorization code from Google
        in: query
        name: code
        type: string
      - description: Opaque state token containing studioId, customerId, and loginCustomerId
        in: query
        name: state
        required: true
        type: string
      - description: Set by Google if the user denied consent or another OAuth error
          occurred
        in: query
        name: error
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML page that closes the popup
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Google OAuth callback
      tags:
      - Google Ads
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies credentials, issues a JWT, and sets it as an HttpOnly
        session cookie. Rate limited to 10 requests/minute per IP.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_identity.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity.meRes'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "422":
          description: email or password missing
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "429":
          description: too many attempts
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Log in with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Clears the session cookie by expiring it immediately. No auth required
        (safe to call even if no session exists).
      responses:
        "204":
          description: no content
      summary: Log out
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile and, if assigned to a
        studio, that studio's branding info. Clears the session cookie and returns
        401 if the studio backing the session no longer exists/is accessible.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_identity.meRes'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get current session user
      tags:
      - Auth
  /api/v1/auth/password:
    post:
      consumes:
      - application/json
      description: Validates the new password and confirmation, verifies the current
        password, then updates the stored password hash. Rate limited to 10 requests/minute
        per IP.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_identity.changePasswordReq'
      responses:
        "204":
          description: no content
        "401":
          description: session invalid or current password incorrect for auth check
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "422":
          description: validation failed
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "429":
          description: too many attempts
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Change the current user's password
      tags:
      - Auth
  /api/v1/auth/stripe/callback:
    get:
      description: OAuth redirect target that Stripe calls after the studio-admin
        authorizes the connection. Exchanges the authorization code for the connected
        Stripe account ID, saves it against the studio (identified via the OAuth state
        parameter), and redirects back to the frontend settings page. No auth required
        — this is a public redirect from Stripe.
      parameters:
      - description: Stripe OAuth authorization code
        in: query
        name: code
        required: true
        type: string
      - description: Studio ID passed through as OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "307":
          description: Redirect to frontend studio settings page
          schema:
            type: string
        "400":
          description: missing code/state or invalid state
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Stripe not configured or OAuth exchange failed
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Stripe Connect OAuth callback
      tags:
      - Stripe
  /api/v1/links/{id}:
    get:
      description: Public short-link redirect endpoint (e.g. for trigger links shared
        with leads in messages). Records a click (optionally attributed to a lead
        via the leadId query param) and issues an HTTP redirect to the link's configured
        destination URL. No auth required.
      parameters:
      - description: Trigger Link ID
        in: path
        name: id
        required: true
        type: string
      - description: Lead ID to attribute the click to
        in: query
        name: leadId
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: invalid id or invalid destination URL
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: link not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Resolve and redirect a trigger link
      tags:
      - Messaging (Public)
  /api/v1/me/studios/{id}:
