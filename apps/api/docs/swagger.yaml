  internal_decisiontree.ConditionValue:
    additionalProperties: {}
    type: object
  internal_decisiontree.Node:
    properties:
      action:
        $ref: '#/definitions/internal_decisiontree.Action'
      actionValue:
        allOf:
        - $ref: '#/definitions/internal_decisiontree.ConditionValue'
        description: ActionValue stores action-specific config, e.g. {"target_status":"member"}
          for change_status.
      children:
        items:
          $ref: '#/definitions/internal_decisiontree.Node'
        type: array
      conditionType:
        $ref: '#/definitions/internal_decisiontree.ConditionType'
      conditionValue:
        $ref: '#/definitions/internal_decisiontree.ConditionValue'
      createdAt:
        type: string
      id:
        type: string
      label:
        type: string
      parentId:
        type: string
      positionX:
        description: |-
          PositionX/PositionY are the node's canvas coordinates in the visual tree
          builder. Nil means "not yet positioned" — the frontend falls back to an
          auto-computed layout and persists the result back for next time.
        type: number
      positionY:
        type: number
      replyTemplate:
        type: string
      sortOrder:
        type: integer
      treeId:
        type: string
      updatedAt:
        type: string
    type: object
  internal_decisiontree.SimulateResult:
    properties:
      action:
