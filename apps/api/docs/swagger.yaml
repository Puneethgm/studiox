      matched:
        type: boolean
      nodeId:
        type: string
      nodeLabel:
        type: string
      reply:
        type: string
      targetStatus:
        description: TargetStatus is set when Action == ActionChangeStatus.
        type: string
      traversalPath:
        items:
          type: string
        type: array
    type: object
  internal_decisiontree.Tree:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      nodes:
        items:
          $ref: '#/definitions/internal_decisiontree.Node'
        type: array
      studioId:
        type: string
      targetStatuses:
        description: |-
          TargetStatuses limits which lead pipeline stages this tree responds to.
          Empty = responds to all leads. Non-empty = only those statuses.
        items:
          type: string
        type: array
      updatedAt:
        type: string
    type: object
  internal_decisiontree.createNodeReq:
