  /internal/tg-web/media:
    post:
      consumes:
      - multipart/form-data
      description: Receives raw media bytes tg-web already downloaded from Telegram
        (via GramJS's downloadMedia) and saves them under ./uploads, the same convention
        every other channel's inbound media uses. Unlike the bot's TelegramDownloadFile
        (which the Go API can call directly against Telegram's HTTP file API), an
        MTProto session's media can only be fetched through the GramJS client that
        owns it — tg-web is the only thing that can do that download, so it pushes
        the resulting bytes here rather than the Go side pulling them. Internal-only
        (Docker-network only, not exposed via nginx) — no session/API-key auth, authenticated
        via the shared `x-internal-key` header instead.
      parameters:
      - description: Media file bytes
        in: formData
        name: file
        required: true
        type: file
      - description: MIME type, used to infer an extension when the filename has none
        in: formData
        name: mimeType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: file too large, bad multipart form, or missing file field
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Upload downloaded Telegram Web media
      tags:
      - Messaging - Internal
  /internal/tg-web/sessions:
