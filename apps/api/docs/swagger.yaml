    post:
      consumes:
      - application/json
      description: Receives inbound Telegram bot updates for a specific bot. Looks
        up the channel by {botID}, then verifies the request's `X-Telegram-Bot-Api-Secret-Token`
        header against the per-channel secret registered via setWebhook before dispatching
        the update to the messaging service. Always responds 200 for unknown bots
        or malformed payloads so Telegram doesn't retry. No session/API-key auth —
        authenticated via the per-bot secret token header instead.
      parameters:
      - description: Telegram bot ID
        in: path
        name: botID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing bot id or bad request body
          schema:
            type: string
        "403":
          description: invalid secret token
          schema:
            type: string
      summary: Receive inbound Telegram bot webhook events
      tags:
      - Webhooks
  /api/v1/webhooks/twilio:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Receives inbound SMS (and any MMS media attachments) from Twilio
        as an application/x-www-form-urlencoded webhook, then dispatches the message
        to the messaging service. Responds with an empty TwiML document. Always responds
        200 on downstream handling errors so Twilio doesn't retry indefinitely. No
        session/API-key auth — Twilio webhooks are not currently signature-verified
        here.
      produces:
      - text/xml
      responses:
        "200":
          description: empty TwiML response
          schema:
            type: string
        "400":
          description: invalid form data or missing required fields
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Receive inbound Twilio SMS webhook
      tags:
      - Webhooks
  /api/v1/webhooks/x:
    get:
      consumes:
      - application/json
      description: Handles both halves of X's Account Activity webhook. On GET, responds
        to X's CRC challenge by HMAC-SHA256-signing the `crc_token` query param with
        the connected channel's consumer secret and returning the base64-encoded `response_token`.
        On POST, decodes the `direct_message_events` payload and dispatches each inbound
        (non-self) message_create event to the messaging service, always returning
        200. No session/API-key auth — GET is authenticated implicitly by the shared
        consumer secret used to answer the CRC challenge; POST performs no signature
        verification.
      parameters:
      - description: X CRC challenge token (GET only)
        in: query
        name: crc_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: missing crc_token or no active X channel found (GET only)
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: X (Twitter) webhook CRC challenge and inbound DM events
      tags:
      - Webhooks
    post:
      consumes:
      - application/json
      description: Handles both halves of X's Account Activity webhook. On GET, responds
