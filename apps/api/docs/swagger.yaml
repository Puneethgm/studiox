        a WhatsApp contact that has no message history to carry it in via waWebBackfill
        (a saved contact with no chat yet, or a chat whose only messages were skipped
        as non-text) — see sessions.js's messaging-history.set handler and Service.HandleWAWebContactName.
        Internal-only (Docker-network only, not exposed via nginx) — no session/API-key
        auth, authenticated via the shared `x-internal-key` header instead.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid body or studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Record a WhatsApp Web contact's display name
      tags:
      - Messaging - Internal
  /internal/wa-web/disconnected:
    post:
      consumes:
      - application/json
      description: Called by the wa-web Node service when a studio's Baileys session
        disconnects, so we can mark the WhatsApp Web channel as disconnected in our
        database. Internal-only (Docker-network only, not exposed via nginx) — no
        session/API-key auth, authenticated via the shared `x-internal-key` header
        instead.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid body or studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Report a WhatsApp Web session disconnected
      tags:
      - Messaging - Internal
  /internal/wa-web/inbound:
    post:
      consumes:
      - application/json
      description: Called by the wa-web Node service for each inbound (or self-sent)
        message observed on a studio's Baileys session, so it can be recorded and
        processed by the messaging service. Internal-only (Docker-network only, not
        exposed via nginx) — no session/API-key auth, authenticated via the shared
        `x-internal-key` header instead.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid body or studioId
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Receive an inbound WhatsApp Web message
      tags:
      - Messaging - Internal
  /internal/wa-web/studios:
    get:
      description: 'Feeds the wa-web Node service''s startup rehydration: returns
        the studio IDs that have a WhatsApp Web channel, so their Baileys sessions
        can be reconnected on boot (the real auth state lives on a Docker volume,
        not in this response). Internal-only (Docker-network only, not exposed via
        nginx) — no session/API-key auth, authenticated via the shared `x-internal-key`
        header instead.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: List studios with a WhatsApp Web channel
      tags:
      - Messaging - Internal
schemes:
- http
