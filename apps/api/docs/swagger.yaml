  /api/v1/webhooks/stripe:
    post:
      consumes:
      - application/json
      description: Verifies and processes an inbound Stripe webhook event. Not authenticated
        via cookies — Stripe signs the request body instead, verified against the
        Stripe-Signature header using the studio's or platform's webhook secret. Events
        are deduplicated by event ID before processing. Handles checkout.session.completed
        and payment_link.payment.completed (finalizes trial/membership checkout, sends
        a WhatsApp confirmation, syncs the lead to Glofox, and cancels superseded
        subscriptions on upgrades/plan changes), payment_intent.succeeded (the embedded
        Stripe Elements trial payment flow's equivalent of checkout completion), invoice.payment_failed
        (marks the studio past_due), and customer.subscription.updated/deleted (marks
        the studio canceled). Other event types are accepted but ignored.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid webhook signature
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "401":
          description: no webhook secret configured to verify the signature
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "503":
          description: failed to read request body
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      summary: Receive a Stripe webhook event
      tags:
      - Stripe Webhooks
  /api/v1/webhooks/stripe/{studioId}:
    post:
      consumes:
