    - messenger_meta
    - x_dm
    - sms
    - google_ads
    - telegram
    - telegram_mtproto
    type: string
    x-enum-comments:
      KindTelegramMTProto: QR-linked via tg-web/teleproto (no bot needed)
      KindWhatsAppWeb: QR-linked via Baileys (no Meta API needed)
    x-enum-descriptions:
    - ""
    - QR-linked via Baileys (no Meta API needed)
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - QR-linked via tg-web/teleproto (no bot needed)
    x-enum-varnames:
