  /api/v1/me/studios/{id}/billing/history:
    get:
      description: Queries Stripe for succeeded PaymentIntents (trial and plan payments)
        for the studio's connected Stripe account and returns them as invoice-like
        line items along with lifetime-paid totals. Supports optional startDate/endDate
        Unix-timestamp filters. Pass "global" as the id to read platform-level Stripe
        history instead of a specific studio.
      parameters:
      - description: Studio ID, or \
        in: path
        name: id
        required: true
        type: string
      - description: Unix timestamp (seconds) to filter payments created on or after
        in: query
        name: startDate
        type: string
      - description: Unix timestamp (seconds) to filter payments created on or before
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid studio id
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: studio not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Get Stripe billing/payment history
      tags:
      - Billing
  /api/v1/me/studios/{id}/billing/portal:
    post:
      description: Looks up the studio's Stripe customer by contact email against
        the platform's Stripe account and creates a Stripe billing-portal session
        so the studio can manage their existing subscription (update payment method,
        view invoices, cancel, etc.). Returns the portal session URL to redirect the
        studio to.
      parameters:
      - description: Studio ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: global studio, invalid studio ID, or no active subscription
            to manage
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: studio not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: platform Stripe account not configured, or Stripe error creating
            the session
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Create a Stripe billing portal session
      tags:
      - Billing
  /api/v1/me/studios/{id}/billing/sync:
    post:
      description: Checks Stripe directly for the studio's subscription status and
        updates the DB accordingly. This is the fallback for when webhooks don't fire
        (e.g. local dev). Looks up the Stripe customer by contact email, finds an
        active/trialing subscription, resolves the plan tier from subscription metadata
        (falling back to matching checkout session metadata), and updates the studio's
        stored subscription tier to canceled, past_due-restored, or the resolved tier
        as appropriate. In the local environment (API_ENV=local) it reports status
        without writing any DB changes.
      parameters:
      - description: Studio ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: global studio or invalid studio ID
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: studio not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Sync billing status from Stripe
      tags:
      - Billing
  /api/v1/me/studios/{id}/billing/upgrade:
    post:
      consumes:
      - application/json
      description: Looks up the requested tier's price from the platform plans setting
        (or hardcoded defaults) and creates a Stripe Checkout session for the studio
        to pay for/upgrade to that plan. Uses subscription mode for recurring tiers,
        or one-time payment mode for the "Trial Pass" tier. The session is tagged
        with plan_tier/studio_id/is_upgrade metadata so the Stripe webhook can finalize
        the upgrade (and cancel any superseded subscription) once payment completes.
        Returns the Checkout session URL to redirect the studio to.
      parameters:
      - description: Studio ID
        in: path
        name: id
        required: true
        type: string
      - description: Target plan tier name
        in: body
        name: body
        required: true
        schema:
          properties:
            tier:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: global studio, invalid studio ID, invalid request body, or
            invalid subscription tier
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: studio not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: platform Stripe account not configured, or Stripe error creating
            the checkout session
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Upgrade or purchase a studio's subscription plan
      tags:
      - Billing
  /api/v1/me/studios/{id}/delete-account:
    delete:
      consumes:
      - application/json
      description: Permanently deletes the studio and all associated data (cascading
        via foreign key constraints), after confirming the caller-supplied email matches
        the studio's contact email. Caller must belong to the studio being deleted.
      parameters:
      - description: Studio ID
        in: path
        name: id
        required: true
        type: string
      - description: Confirmation email (email)
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid studio id, invalid JSON, or email mismatch
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "403":
          description: caller does not belong to this studio
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "404":
          description: studio not found
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
        "500":
          description: delete failed
          schema:
            $ref: '#/definitions/github_com_projectx_api_internal_platform_httpx.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Delete a studio account
      tags:
      - Studios
  /api/v1/me/studios/{id}/logo:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a studio logo image (max 5MB, JPEG/PNG/WebP/GIF). Stores
