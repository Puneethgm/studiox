  internal_messaging.Conversation:
    properties:
      aiEnabled:
        type: boolean
      assignedTo:
        type: string
      channelAccountId:
        type: string
      channelHandle:
        description: joined for the UI
        type: string
      channelKind:
        allOf:
        - $ref: '#/definitions/internal_messaging.ChannelKind'
        description: joined for the UI
      contactDisplayName:
        type: string
      contactIdentityId:
        type: string
      contactValue:
        description: phone or handle
        type: string
      createdAt:
        type: string
      currentTreeNodeId:
        description: |-
          CurrentTreeNodeID is the last decision-tree node this conversation
          matched — the next inbound message is checked against this node's
          children first (continuing the "flow") before falling back to a full
          root match. Nil means start from the tree root. See
          decisiontree.Service.TraverseActiveTree and Repo.SetConversationTreeNode.
        type: string
      dndEnabled:
        description: |-
          DNDEnabled silences automation for this conversation even when there's
          no linked lead to carry the (older, lead-scoped) leads.dnd_enabled
          flag — see ai_worker.go, which checks both.
        type: boolean
      escalatedAt:
        description: |-
          EscalatedAt is set when a decision-tree escalate_human node matches for
          this conversation; it gates the conversation out of the regular Inbox
          list and into the Escalation tab until resolved. See EscalateConversation.
        type: string
      escalatedReason:
        type: string
      externalThreadId:
        type: string
      id:
        type: string
      lastMessageAt:
        type: string
      lastMessageDirection:
        $ref: '#/definitions/internal_messaging.Direction'
      lastMessagePreview:
        type: string
      leadId:
        type: string
      leadStatus:
        type: string
      status:
        $ref: '#/definitions/internal_messaging.ConvStatus'
      studioId:
        type: string
      unreadCount:
        type: integer
      updatedAt:
        type: string
    type: object
