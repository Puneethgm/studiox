# Single-binary Loki config for one EC2 box — filesystem storage, no object
# store, no clustering. Fine at this app's traffic; if logs volume grows a
# lot later, the retention/compactor settings below are the first thing to
# revisit before reaching for S3-backed storage.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Keep this ahead of what a WhatsApp Web backfill burst or a noisy retry
  # loop could plausibly produce — loosen further only if Promtail starts
  # dropping lines (check its own logs for "rate limited").
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  retention_period: 720h # 30 days — matches deploy/backup.sh's own 14-day
                         # local-disk retention philosophy (keep a useful
                         # recent window, not forever); raise if you need
                         # longer log history for compliance/debugging.

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
