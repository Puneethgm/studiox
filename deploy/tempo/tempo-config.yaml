# Single-binary Tempo for one EC2 box — local filesystem storage, no
# clustering. Stores traces; Grafana's Tempo datasource (provisioned in
# deploy/grafana/provisioning/datasources/) reads them, and Loki's
# derivedFields link a trace_id found in a log line straight here.
#
# metrics_generator (below) computes service-graph/span-metrics from
# traces and remote-writes them into Prometheus — that's what makes
# Grafana's Tempo "Service Graph" view work (without it: "No service
# graph datasource selected", confirmed live — that's what this fixes).

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h # 7 days — traces are far higher-volume than logs,
                           # so a shorter window than Loki's 30 days

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
