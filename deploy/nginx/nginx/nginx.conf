events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # =========================================================================
  # ACTIVE: HTTPS & Domain Setup (For 1herosocial.ai)
  # =========================================================================
  # 1. Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name 1herosocial.ai www.1herosocial.ai;
    return 301 https://$host$request_uri;
  }

  # 2. Secure HTTPS Server
  server {
    listen 443 ssl;
    server_name 1herosocial.ai www.1herosocial.ai;

    ssl_certificate     /etc/letsencrypt/live/1herosocial.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1herosocial.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # API routes → Go backend
    location /api/ {
      proxy_pass         http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Stripe webhook
    location /webhook/ {
      proxy_pass         http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Uploaded files
    location /uploads/ {
      alias /var/uploads/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Next.js frontend
    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

