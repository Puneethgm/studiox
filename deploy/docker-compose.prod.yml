# Production stack for Project-X. Run on the EC2 box from this directory:
#
#   docker compose -f docker-compose.prod.yml up -d
#

name: projectx-prod

# Env shared by every Go-API-based service (api + seed).
x-api-env: &api_env
  API_HTTP_ADDR: ":8080"
  API_ENV: production
  API_LOG_LEVEL: info
  API_CORS_ORIGINS: ${PUBLIC_FORM_BASE_URL}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL_HOURS: "24"
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
  COOKIE_NAME: px_session
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  GOOGLE_CREDENTIALS_PATH: /secrets/google-credentials.json
  GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
  GOOGLE_SHEETS_TAB: ${GOOGLE_SHEETS_TAB:-Leads}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
  WA_WEB_SERVICE_URL: http://wa-web:3100
  TG_WEB_SERVICE_URL: http://tg-web:3101
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${PUBLIC_FORM_BASE_URL}}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  GLOFOX_API_KEY: ${GLOFOX_API_KEY:-}
  GLOFOX_API_TOKEN: ${GLOFOX_API_TOKEN:-}
  GLOFOX_BRANCH_ID: ${GLOFOX_BRANCH_ID:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: projectx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - projectx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # One-shot: ensure correct volume permissions for distroless nonroot user
  # (api.Dockerfile runs as uid 65532) before api ever touches the volume.
  init-uploads:
    image: alpine:3.19
    container_name: projectx-init-uploads
    user: "0:0"
    volumes:
      - uploads_data:/uploads
      - ./secrets:/secrets
    command: sh -c "chown -R 65532:65532 /uploads && chmod 700 /secrets && chown -R 65532:65532 /secrets"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: projectx-api
    restart: unless-stopped
    environment: *api_env
    volumes:
      - ./secrets:/secrets
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      init-uploads:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - backend
      - frontend

  wa-web:
    build:
      context: ..
      dockerfile: deploy/wa-web.Dockerfile
    container_name: projectx-wa-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3100"
      LOG_LEVEL: info
      PROJECTX_API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      AUTH_DIR: /auth
    volumes:
      - wa_auth_data:/auth
    expose:
      - "3100"
    networks:
      - backend

  tg-web:
    build:
      context: ..
      dockerfile: deploy/tg-web.Dockerfile
    container_name: projectx-tg-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3101"
      LOG_LEVEL: info
      PROJECTX_API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID must be set — get one from https://my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH must be set — get one from https://my.telegram.org}
    # No volume: unlike wa-web's Baileys multi-file auth state, a GramJS
    # session is a single string the Go API stores (encrypted) in Postgres
    # and hands back to tg-web on startup — see ListTGWebSessions.
    expose:
      - "3101"
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        API_BASE_URL: http://api:8080
    container_name: projectx-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_BASE_URL: http://api:8080
      # Server-side fetches (RSC) hit the API on the docker-internal network.
      # Browser fetches use relative paths and go through nginx.
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    container_name: projectx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads_data:/var/uploads:ro
    depends_on:
      - api
      - web
    networks:
      - frontend

  # One-shot: run migrations.
  migrate:
    image: projectx-prod-api:latest
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/goose"]
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-require}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # One-shot: seed the super-admin.
  seed:
    image: projectx-prod-api:latest
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/seed"]
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  projectx_pg_data:
  uploads_data:
  wa_auth_data:

networks:
  backend:
  frontend:
