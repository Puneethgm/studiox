# Production stack for Project-X. Run on the EC2 box from this directory:
#
#   docker compose -f docker-compose.prod.yml up -d
#

name: projectx-prod

# Env shared by every Go-API-based service (api + seed).
x-api-env: &api_env
  API_HTTP_ADDR: ":8080"
  API_ENV: production
  API_LOG_LEVEL: info
  API_CORS_ORIGINS: ${PUBLIC_FORM_BASE_URL}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL_HOURS: "24"
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
  COOKIE_NAME: px_session
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  GOOGLE_CREDENTIALS_PATH: /secrets/google-credentials.json
  GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
  GOOGLE_SHEETS_TAB: ${GOOGLE_SHEETS_TAB:-Leads}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: projectx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - projectx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: projectx-api
    restart: unless-stopped
    environment: *api_env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://1herosocial.ai
    container_name: projectx-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://1herosocial.ai
    expose:
      - "3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: projectx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads_data:/var/uploads:ro
    depends_on:
      - api
      - web

  # One-shot: run migrations.
  migrate:
    image: deploy-api:latest
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/goose"]
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: seed the super-admin.
  seed:
    image: deploy-api:latest
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/seed"]
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  projectx_pg_data:
  uploads_data:
