# Production stack for Project-X. Run on the EC2 box from this directory:
#
#   docker compose up -d                    # bring up postgres + api + web + nginx
#   docker compose --profile tools run --rm migrate   # apply migrations
#   docker compose --profile tools run --rm seed      # seed/refresh super admin
#   docker compose logs -f                  # tail logs
#
# Most of the time you'll just run ../deploy.sh from the repo root which
# does pull → build → migrate → seed → up in one shot.

name: projectx

# Env shared by every Go-API-based service (api + seed). Migrate doesn't
# need it because the DSN is on the goose command line.
x-api-env: &api_env
  API_HTTP_ADDR: ":8080"
  API_ENV: production
  API_LOG_LEVEL: info
  # Comma-separated (config.go splits on it). Defaults to just the public
  # site, same as before — set API_CORS_ORIGINS explicitly in .env to add
  # more (e.g. a locally-run `next dev` origin, see deploy/README.md's
  # Observability section).
  API_CORS_ORIGINS: ${API_CORS_ORIGINS:-${PUBLIC_FORM_BASE_URL}}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
  # Optional read-replica host for the API to point read-only queries at
  # (postgres_replica below). Same user/password/db/port as the primary.
  # Blank by default — until the Go side opts into it, this is a no-op.
  POSTGRES_READ_HOST: ${POSTGRES_READ_HOST:-}
  JWT_SECRET: ${JWT_SECRET}
  JWT_TTL: "30m"
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
  COOKIE_NAME: px_session
  COOKIE_DOMAIN: ${COOKIE_DOMAIN}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  GOOGLE_CREDENTIALS_PATH: /secrets/google-credentials.json
  GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
  GOOGLE_SHEETS_TAB: ${GOOGLE_SHEETS_TAB:-Leads}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
  WA_WEB_SERVICE_URL: http://wa-web:3100
  TG_WEB_SERVICE_URL: http://tg-web:3101
  EMBEDDINGS_SERVICE_URL: http://embeddings:8001
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${PUBLIC_FORM_BASE_URL}}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  GLOFOX_API_KEY: ${GLOFOX_API_KEY:-}
  GLOFOX_API_TOKEN: ${GLOFOX_API_TOKEN:-}
  GLOFOX_BRANCH_ID: ${GLOFOX_BRANCH_ID:-}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set — generate one with openssl rand -base64 24}"
  REDIS_DB: "0"
  AI_ANSWER_CACHE_TTL: ${AI_ANSWER_CACHE_TTL:-30m}
  SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-15m}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  # Defaults to the otel-collector service below. tracing.Init() treats an
  # empty value as a deliberate no-op (internal/platform/tracing) — set
  # OTEL_EXPORTER_OTLP_ENDPOINT="" in .env to disable tracing entirely
  # without editing this file.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by deploy/postgres/init-replication.sql on first init to set
      # the `replicator` role's password.
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD must be set}
    # Enables streaming replication to postgres_replica:
    #   wal_level=replica       — write enough WAL detail for a standby to replay
    #   max_wal_senders=4       — concurrent replication connections allowed (1 replica today, headroom for more)
    #   hot_standby=on          — harmless here (it's a standby-side setting); kept explicit for clarity
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "hot_standby=on"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Run order matters: the hba script must land before the role-create
      # script alphabetically/numerically so pg_hba.conf is already
      # permissive by the time anything might connect.
      - ./postgres/init-replication-hba.sh:/docker-entrypoint-initdb.d/10-init-replication-hba.sh:ro
      - ./postgres/init-replication.sql:/docker-entrypoint-initdb.d/20-init-replication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # Streaming (physical) read replica of `postgres`, cloned via
  # pg_basebackup on first boot — see deploy/postgres/replica-entrypoint.sh.
  # Read-scaling/failover-visibility only for now: nothing here promotes it
  # automatically if the primary goes down. See deploy/README.md.
  postgres_replica:
    image: pgvector/pgvector:pg16
    restart: always
    user: postgres
    entrypoint: ["/scripts/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # Per-studio AI-answer cache (internal/messaging.AnswerCache). Backend-only
  # — never exposed on a host port, since only the api container needs it.
  # No volume: it's a cache, safe to lose on restart/redeploy.
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set — generate one with: openssl rand -base64 24}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # One-shot: run migrations.
  migrate:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: projectx-api:local
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/goose"]
    command:
      - "-dir"
      - "/migrations"
      - "postgres"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-require}"
      - "up"
    restart: "no"
    networks:
      - backend

  # One-shot: upsert the super-admin from env (idempotent).
  seed:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: projectx-api:local
    profiles: ["tools"]
    environment: *api_env
    entrypoint: ["/usr/local/bin/seed"]
    restart: "no"
    networks:
      - backend

  # One-shot: re-embed existing studio_knowledge_chunks/messages rows with
  # the local embedding service. Run once after this deploy brings the
  # embeddings service online for the first time (or after ever changing
  # EMBEDDINGS_MODEL_NAME) — old and new vectors aren't the same space, so
  # leaving stale rows unembedded silently degrades search ranking rather
  # than failing loudly. Safe to re-run; skips nothing already correct.
  backfill-embeddings:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: projectx-api:local
    profiles: ["tools"]
    environment: *api_env
    entrypoint: ["/usr/local/bin/backfill-embeddings"]
    restart: "no"
    networks:
      - backend

  # One-shot: ensure correct volume permissions for distroless nonroot user
  init-uploads:
    image: alpine:3.19
    user: "0:0"
    volumes:
      - uploads_data:/uploads
      - ./secrets:/secrets
    command: sh -c "chown -R 65532:65532 /uploads && chmod 700 /secrets && chown -R 65532:65532 /secrets"
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: projectx-api:local
    restart: always
    # Bound to localhost only, same as Grafana — lets a locally-run web dev
    # server (apps/web's `next dev`, not containerized) reach this API
    # directly, and lets anything on the box curl/debug it. In production,
    # nginx is still the only public path to the API; this is additive,
    # not a replacement route. Configurable in case 8099 collides with
    # something else, same pattern as GRAFANA_PORT.
    ports:
      - "127.0.0.1:${API_PORT:-8099}:8080"
    depends_on:
      init-uploads:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment: *api_env
    volumes:
      - ./secrets:/secrets
      - uploads_data:/app/uploads
    networks:
      - backend
      - frontend

  wa-web:
    build:
      context: ..
      dockerfile: deploy/wa-web.Dockerfile
    image: projectx-wa-web:local
    restart: always
    depends_on:
      - api
      - otel-collector
    environment:
      PORT: "3100"
      LOG_LEVEL: info
      PROJECTX_API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      AUTH_DIR: /auth
      # OTLP/HTTP form (Node's exporter, unlike the Go API's OTLP/gRPC) —
      # see src/tracing.js. Empty disables tracing, same no-op contract.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${WA_WEB_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
    volumes:
      - wa_auth_data:/auth
    networks:
      - backend

  tg-web:
    build:
      context: ..
      dockerfile: deploy/tg-web.Dockerfile
    image: projectx-tg-web:local
    restart: always
    depends_on:
      - api
      - otel-collector
    environment:
      PORT: "3101"
      LOG_LEVEL: info
      PROJECTX_API_URL: http://api:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID must be set — get one from https://my.telegram.org}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH must be set — get one from https://my.telegram.org}
      # OTLP/HTTP form, same as wa-web — see src/tracing.js. Empty disables
      # tracing, same no-op contract.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${TG_WEB_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
    # No volume: unlike wa-web's Baileys multi-file auth state, a GramJS
    # session is a single string the Go API stores (encrypted) in Postgres
    # and hands back to tg-web on startup — see ListTGWebSessions.
    networks:
      - backend

  embeddings:
    build:
      context: ..
      dockerfile: deploy/embeddings.Dockerfile
    image: projectx-embeddings:local
    restart: always
    depends_on:
      - otel-collector
    environment:
      PORT: "8001"
      MODEL_NAME: ${EMBEDDINGS_MODEL_NAME:-intfloat/multilingual-e5-base}
      # OTLP/HTTP form, same as wa-web/tg-web — see tracing.py. Empty
      # disables tracing, same no-op contract.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${EMBEDDINGS_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
    volumes:
      - embeddings_cache:/cache/huggingface
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        API_BASE_URL: http://api:8080
    image: projectx-web:local
    restart: always
    depends_on:
      - api
      - otel-collector
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_BASE_URL: http://api:8080
      # Server-side fetches (RSC) hit the API on the docker-internal network.
      # Browser fetches use relative paths and go through nginx.
      # See src/instrumentation.ts. Empty disables tracing, same no-op
      # contract as the other 3 services.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${WEB_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uploads_data:/var/uploads:ro
    depends_on:
      - web
      - api
    networks:
      - frontend

  # ---- Observability (Phase 1: logs + traces) ----
  # Loki (log storage) + Promtail (ships every container's stdout here) +
  # Tempo (trace storage) + an OTel Collector (receives traces from
  # instrumented services, forwards to Tempo) + Prometheus (receives
  # service-graph/span-metrics Tempo computes from traces, powers Grafana's
  # Tempo "Service Graph" view) + Grafana (browse/search all of it, and
  # jump from a log line's trace_id straight into its trace). See deploy/
  # README.md's Observability section.
  #
  # api, wa-web, and tg-web are instrumented (internal/platform/tracing /
  # src/tracing.js) — web (Next.js) isn't yet.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Lets Tempo's metrics_generator push service-graph/span-metrics here
      # directly (remote_write) instead of Prometheus having to scrape an
      # exporter — there's nothing to scrape yet, this stack has no app
      # metrics endpoints.
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend

  tempo:
    image: grafana/tempo:2.6.1
    restart: always
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      - prometheus
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
    # Needs both networks — api/wa-web/tg-web reach it via backend, and web
    # (frontend-only, see the web service below) needs a route to it too.
    # It has no host-published port either way, so this doesn't widen its
    # exposure, just which internal services can reach it.
    networks:
      - backend
      - frontend

  loki:
    image: grafana/loki:2.9.8
    restart: always
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:2.9.8
    restart: always
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only, but note this still grants the container visibility into
      # the full Docker API (how Promtail's Docker service-discovery
      # works, same trust model every Docker-aware log shipper uses —
      # cAdvisor, Portainer, etc.) — not just "read container logs". Fine
      # for a single-operator EC2 box; revisit with a socket-proxy
      # (e.g. tecnativa/docker-socket-proxy) before adding anyone else
      # with shell access to this host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.3
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set — generate one with openssl rand -base64 18}"
      # No self-signup, no anonymous access — admin-created accounts only.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # Bound to localhost only — reach it via an SSH tunnel
    # (ssh -L 3001:localhost:3001 ...), never exposed publicly, same
    # reasoning as not proxying it through nginx. See deploy/README.md.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - loki
    networks:
      - backend

volumes:
  pg_data:
  pg_replica_data:
  uploads_data:
  wa_auth_data:
  embeddings_cache:
  loki_data:
  grafana_data:
  tempo_data:
  prometheus_data:

networks:
  backend:
  frontend:
