services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: projectx-postgres
    restart: unless-stopped
    command: postgres -c password_encryption=md5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projectx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectx_dev}
      POSTGRES_DB: ${POSTGRES_DB:-projectx}
    ports:
      - "5436:5432"
    volumes:
      - projectx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectx} -d ${POSTGRES_DB:-projectx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: projectx-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # host.docker.internal resolves to the Docker host — reaches Postgres on 5434
      DATABASE_URL: postgres://${POSTGRES_USER:-projectx}:${POSTGRES_PASSWORD:-projectx_dev}@host.docker.internal:5436/${POSTGRES_DB:-projectx}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: md5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${POSTGRES_PORT:-5435}:5432"

  redis:
    image: redis:7-alpine
    container_name: projectx-redis
    restart: unless-stopped
    # Fails fast if REDIS_PASSWORD isn't set — this instance holds cached AI
    # answers and must never run reachable without auth.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env — generate one with: openssl rand -base64 24}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  projectx_pg_data:
