[databases]
; Route all connections for our DB through to the real Postgres container.
; "postgres" here is the docker-compose service name.
projectx = host=postgres port=5432 dbname=projectx

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; transaction mode = best performance, compatible with simple_protocol in pgx
pool_mode = transaction

; Max connections PgBouncer keeps open to Postgres per pool
default_pool_size = 20
max_client_conn = 200

; Keep the pool alive
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
